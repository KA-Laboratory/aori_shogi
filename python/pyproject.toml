[project]
name = "aori-lab"
version = "0.1.0"
description = "煽り将棋 Python 版: 自由文で対話・交渉できる軍師と、AI同士の学習実験場"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
dependencies = [
  "cshogi>=0.9",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "httpx>=0.27",
  "pydantic>=2.7",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aori_lab"]
