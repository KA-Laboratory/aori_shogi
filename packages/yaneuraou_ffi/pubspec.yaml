name: yaneuraou_ffi
description: "煽り将棋用: やねうら王（GPLv3）を同一プロセスで動かす FFI プラグイン"
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.12.2
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter
  ffi: ^2.1.3

dev_dependencies:
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        ffiPlugin: true
      ios:
        ffiPlugin: true
